name: Evaluator regression tests

on:
  push:
    branches:
      - research/evaluation-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest "pydantic>=2.8.0" requests rich
      - name: Run evaluator regression tests
        run: python -m pytest -q tests/test_evaluator.py tests/test_dataset_loader.py
